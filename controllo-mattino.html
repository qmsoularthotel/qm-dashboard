<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1c3a5e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Distribuzione Culligan — Compass QM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#1c3a5e;
  --navy:#1c3a5e; --navy-bg:#e8f0f8; --gold:#c9952f;
  /* Distribuzione: acqua consumata = navy chiaro, non consumata = navy pieno —
     stessa tinta di brand della Riconsegna, solo due intensità. */
  --navy-light:#5B7A9C; --navy-light-bg:#EAF0F6;
  --gold-4:#8A6D1F;
  /* Verde oliva — barra avanzamento e banner "consegnata" in Riconsegna
     (la tile è tornata navy, vedi rc-watermark) */
  --sage-4:#4F7942; --sage-4-bg:#EAF0E4;
  --green:#2e7d32;  --green-bg:#e8f5e9; --green-border:#a5d6a7;
  --amber:#e65100;  --amber-bg:#fff3e0; --amber-border:#ffcc80;
  --red:#c62828;    --red-bg:#ffebee;   --red-border:#ef9a9a;
  --blue:#1565c0;   --blue-bg:#e3f2fd;
  --purple:#6a1b9a; --purple-bg:#f3e5f5;
  --bg:#eef1f5;--surface:#f8f9fb;--surface2:#e8ecf1;--border:rgba(28,58,94,.1);
  --text:#0c1f33;--text-dim:#4a5568;--text-muted:#888;
  --r:14px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.06);
  --sh-lift:0 1px 3px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.07);
  --card-border:1px solid rgba(28,58,94,.1);
  --card-top:inset 0 1px 0 rgba(255,255,255,.9);
}
html{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  background:#eef1f5;
  color:var(--text);-webkit-text-size-adjust:100%;}
body{min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ══ HEADER ══ */
.hdr{background:#1c3a5e;color:#fff;padding:0 16px;
  height:56px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;flex-shrink:0;
  box-shadow:0 2px 0 rgba(201,149,47,.25),0 4px 20px rgba(0,0,0,.25);
  border-bottom:2px solid #c9952f;}
.hdr-logo{height:24px;width:auto;object-fit:contain;flex-shrink:0;}
.hdr-sep{width:1px;height:20px;background:rgba(255,255,255,.15);flex-shrink:0;}
.hdr-center{flex:1;min-width:0;}
.hdr-title{font-size:.82rem;font-weight:600;line-height:1.2;letter-spacing:.01em;}
.hdr-sub{font-size:.6rem;color:rgba(255,255,255,.45);margin-top:1px;}
.btn-back{background:none;border:none;color:rgba(255,255,255,.7);
  font-size:1.6rem;cursor:pointer;padding:4px 8px 4px 0;line-height:1;
  -webkit-tap-highlight-color:transparent;flex-shrink:0;}
.hdr-date{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.55);
  white-space:nowrap;flex-shrink:0;}

/* ══ BODY ══ */
.body{flex:1;overflow-y:auto;padding:12px 12px 24px;}

/* ══ BANNER PIANO ══ */
.piano-banner{border-radius:var(--r);padding:11px 14px;margin-bottom:10px;
  font-size:.77rem;font-weight:500;line-height:1.45;}
.piano-banner.loaded {background:var(--green-bg);color:var(--green);}
.piano-banner.partial{background:#FEF9C3;color:#854D0E;}
.piano-banner.missing{background:#FEF9C3;color:#854D0E;
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.btn-reload-piano{background:rgba(0,0,0,.1);border:none;color:inherit;
  padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;}

/* ══ PROGRESS ══ */
.prog-wrap{background:var(--surface);border-radius:var(--r);
  padding:13px 16px 14px;margin-bottom:10px;
  box-shadow:var(--sh-lift);border:var(--card-border);border-top:3px solid var(--gold);}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.prog-lbl{font-size:.68rem;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-muted);}
.prog-val{font-size:1.4rem;font-weight:900;color:var(--black);}
.prog-bar{height:12px;background:#DCDCDE;border-radius:8px;overflow:hidden;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.14);}
.prog-fill{height:100%;background:linear-gradient(90deg,#1c3a5e 0%,#2d6ab4 100%);
  border-radius:8px;transition:width .6s cubic-bezier(.4,0,.2,1);}

/* ══ STAT GRID ══ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
.stat-box{background:var(--surface);border-radius:var(--r);
  padding:12px 6px;text-align:center;
  box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);}
.stat-n{font-size:1.4rem;font-weight:800;line-height:1;}
.stat-l{font-size:.58rem;font-weight:600;letter-spacing:.02em;
  color:var(--text-muted);margin-top:4px;line-height:1.2;}

/* ══ BOTTONI ══ */
.action-row{display:flex;gap:8px;margin-bottom:12px;}
.btn-main{flex:1;background:#1c3a5e;color:#fff;border:none;
  padding:14px 10px;border-radius:var(--r);font-size:.88rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 14px rgba(0,0,0,.32),0 1px 3px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.07);}
.btn-main:active{opacity:.78;transform:scale(.98);}
.btn-sec{flex:1;background:var(--surface);border:1.5px solid rgba(255,255,255,.6);
  color:var(--text-dim);padding:14px 10px;border-radius:var(--r);
  font-size:.82rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
  box-shadow:var(--sh-lift),var(--card-top);}
.btn-sec:active{opacity:.7;}

/* ══ ROOM GRID ══ */
.rooms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.room-card{background:#fff;border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;
  box-shadow:var(--sh-lift),var(--card-top);
  border:var(--card-border);text-align:center;
  -webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .12s;
  display:flex;flex-direction:column;}
.room-card:active{transform:scale(.94);}
.room-card.s-empty{opacity:.38;}
/* metà superiore: colore pieno per stato (visibile da lontano), contiene il numero */
/* Altezza fissa: alcune card hanno una riga in più (badge BK) e senza un'altezza
   comune la fascia colorata risulterebbe più alta solo su quelle, rompendo l'allineamento
   della griglia. min-height copre anche la variante con badge; il contenuto più corto
   resta centrato invece di lasciare la fascia più bassa. */
.rc-top{position:relative;padding:14px 9px 10px;background:var(--surface2);min-height:104px;display:flex;align-items:center;justify-content:center;}
/* "Camera pronta" — solo Riconsegna, solo camere non in fermata (partenza/cambio).
   Tap sulla tile apre un foglio con due bottoni grandi (.ready-sheet) invece di un
   bersaglio piccolo da colpire in movimento; la scelta lascia una striscia fissa in
   fondo alla card (.rc-ready-strip), indipendente dal colore gold/oliva sopra.
   Sincronizzato su KV: la reception lo vede su Compass mentre il giro è in corso. */
.rc-ready-strip{height:22px;display:flex;align-items:center;justify-content:center;
  font-size:.58rem;font-weight:800;color:#fff;}
.rc-ready-strip.yes{background:var(--green);}
.rc-ready-strip.no{background:var(--amber);}
.rc-ready-strip.pending{background:var(--text-dim);}
.ready-sheet{background:#fff;padding:14px;}
.ready-sheet-title{font-size:.8rem;font-weight:700;color:var(--text);text-align:center;margin-bottom:12px;}
.ready-sheet-btns{display:flex;gap:10px;}
.ready-big{flex:1;border:none;border-radius:12px;padding:20px 8px;font-size:.82rem;
  font-weight:800;line-height:1.7;-webkit-tap-highlight-color:transparent;}
.ready-big.no{background:var(--amber-bg);color:var(--amber);}
.ready-big.yes{background:var(--green-bg);color:var(--green);}
/* Link piccolo sotto i due bottoni grandi, non un terzo bottone alla pari — i due
   bersagli principali restano grandi (si usa camminando), l'annulla è un'uscita di
   sicurezza secondaria, non un'azione che compete per spazio/attenzione. */
.ready-cancel{display:block;width:100%;background:none;border:none;color:var(--text-dim);
  font-size:.76rem;font-weight:600;text-align:center;padding:10px 0 2px;-webkit-tap-highlight-color:transparent;}
/* Popup "camera pronta" — compare impostando la bottiglia su "non consumata" in una
   camera con arrivo. Sopra la save-bar (z-index 200) perché ci si sovrappone. */
.ready-pop{position:fixed;inset:0;z-index:400;background:rgba(12,26,48,.55);
  display:flex;align-items:center;justify-content:center;padding:18px;}
.ready-pop-card{background:#fff;border-radius:16px;padding:18px 16px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.32);}
.room-card.s-bottle .rc-top,
.room-card.s-both .rc-top   {background:var(--navy-light);}
.room-card.s-ok .rc-top     {background:var(--navy);}
.room-card.s-consegnata .rc-top{background:var(--sage-4);}
.rc-top-row{display:flex;align-items:center;gap:5px;}
.rc-side-ico{flex-shrink:0;}
/* Riconsegna: navy sempre — lo stato (da riconsegnare/consegnata) lo dice l'icona in
   filigrana dietro il numero, non il colore della tile. Scoperto solo qui (#s-redeliver)
   perché la home usa navy-light/navy con icona affiancata invece che in filigrana. */
#s-redeliver .room-card.s-bottle .rc-top,
#s-redeliver .room-card.s-both .rc-top,
#s-redeliver .room-card.s-consegnata .rc-top{background:var(--navy);}
.rc-watermark{position:absolute;bottom:6px;right:6px;opacity:.34;pointer-events:none;z-index:0;}
/* Riconsegna: numero verso l'angolo in alto a sinistra, icona verso l'angolo opposto
   in basso a destra — composizione simmetrica invece di sovrapposta al centro. */
#s-redeliver .rc-top{align-items:flex-start;justify-content:flex-start;padding:10px 0 0 12px;}
#s-redeliver .rc-num{align-items:flex-start;}
#s-redeliver .rc-roomnum{font-size:2.9rem;}
.room-card.s-warn .rc-top   {background:var(--amber);}
.room-card.s-dnd .rc-top,
.room-card.s-missing .rc-top{background:var(--red);}
.room-card.s-pending .rc-top{background:var(--surface2);}
/* metà inferiore: bianca, per icona piano + etichetta + stato testuale */
.rc-bottom{padding:6px 4px 10px;background:#fff;}

/* numero camera — grande per lettura da carrello */
.rc-num{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1;}
.rc-prefix{font-size:.52rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.75);line-height:1.4;margin-bottom:-2px;}
.rc-roomnum{font-size:3.5rem;font-weight:900;color:#fff;line-height:.95;letter-spacing:-.03em;}
.room-card.s-pending .rc-prefix,.room-card.s-empty .rc-prefix{color:var(--text-muted);}
.room-card.s-pending .rc-roomnum,.room-card.s-empty .rc-roomnum{color:var(--text);}

/* icona piano — elemento principale */
.rc-piano-ico{font-size:1.8rem;line-height:1;margin:2px 0 0;}
.rc-piano-ico img{display:block;margin:0 auto;}
/* sprite aereo: immagine 2:1, mostra metà sinistra (partenza) o metà destra (arrivo) */
.ico-partenza{width:32px;height:32px;object-fit:cover;object-position:0% center;}
.ico-arrivo  {width:32px;height:32px;object-fit:cover;object-position:100% center;}
/* mix-blend-mode:multiply rende trasparente il bianco interno delle immagini su sfondo colorato */
.ico-cambio  {width:60px;height:30px;object-fit:cover;object-position:center;mix-blend-mode:multiply;}
.ico-fermata {height:30px;width:auto;display:block;margin:2px auto 0;mix-blend-mode:multiply;}

/* label piano */
.rc-piano-lbl{font-size:.82rem;font-weight:700;color:var(--text);}

/* Progress bar della schermata Riconsegna: verde oliva dedicato, non il navy generico */
#s-redeliver .prog-fill{background:var(--sage-4);}
.sum-hdr.h-consegnata{background:var(--sage-4-bg);color:var(--sage-4);}

/* ══ CHECKLIST ══ */
.cl-body{flex:1;overflow-y:auto;padding:12px 12px 90px;}

.piano-strip{border-radius:10px;padding:16px 14px;margin-bottom:12px;
  font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.ps-partenza{background:var(--red-bg);color:var(--red);}
.ps-fermata {background:var(--blue-bg);color:var(--blue);}
.ps-cambio  {background:#F3E8FF;color:#7C3AED;}
.ps-libera  {background:var(--surface2);color:var(--text-dim);}

/* Bottiglia */
.bottle-card{background:var(--surface);border-radius:var(--r);
  padding:16px;margin-bottom:10px;box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);border-top:3px solid var(--gold-4);}
.bottle-card-title{font-size:.82rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--text-muted);margin-bottom:12px;}
.bottle-seg{display:flex;flex-direction:column;gap:8px;}
.bseg{width:100%;padding:18px 20px;
  border:2px solid rgba(0,0,0,.07);border-left:5px solid rgba(0,0,0,.1);
  border-radius:14px;cursor:pointer;
  background:#F8F8F9;color:var(--text);text-align:left;
  -webkit-tap-highlight-color:transparent;transition:all .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  display:flex;align-items:center;gap:18px;}
.bseg-ico{font-size:2rem;flex-shrink:0;width:38px;text-align:center;line-height:1;}
.bseg-body{flex:1;display:flex;flex-direction:column;gap:2px;}
.bseg-lbl{font-size:1.25rem;font-weight:800;line-height:1.2;display:block;}
.bseg-sub{font-size:.8rem;opacity:.65;line-height:1.3;font-weight:500;display:block;}
.bseg:active{opacity:.75;transform:scale(.98);}
.bseg.bc-consumata{background:var(--navy-light-bg);border-left-color:var(--navy-light);color:var(--navy-light);}
.bseg.bc-noncons  {background:var(--navy-bg);border-left-color:var(--navy);color:var(--navy);}
.bseg.bc-nonpres  {background:var(--red-bg);border-left-color:var(--red);color:var(--red);}
.bseg.bc-dnd      {background:var(--red-bg);border-left-color:var(--red);color:var(--red);}

/* DND */
.dnd-card{background:var(--red-bg);border:1px solid rgba(220,38,38,.12);border-radius:var(--r);
  padding:20px 16px;margin-bottom:10px;text-align:center;border-top:3px solid var(--red);}
.dnd-card-title{font-size:1.05rem;font-weight:800;color:var(--red);margin-bottom:4px;}
.dnd-card-sub{font-size:.78rem;color:var(--red);line-height:1.5;}

/* Quick */
.quick-row{display:flex;gap:7px;margin-bottom:10px;}
.btn-q{flex:1;background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-muted);padding:18px 4px;border-radius:10px;
  font-size:1.05rem;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;line-height:1.3;text-align:center;}
.btn-q.active-libera{background:var(--surface2);border-color:var(--text-muted);color:var(--text);}
.btn-q.active-dnd   {background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.btn-q.btn-ok{border-color:var(--green-border);color:var(--green);font-weight:700;}
.btn-q:active{opacity:.7;}

/* Checklist sections */
.chk-sec{background:var(--surface);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);border-top:3px solid var(--gold);}
.chk-sec-hdr{padding:13px 14px;font-size:.82rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);background:var(--surface2);
  display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.chk-all-btn{font-size:.78rem;color:var(--black);font-weight:700;
  cursor:pointer;background:none;border:none;padding:2px 8px;
  -webkit-tap-highlight-color:transparent;}
.chk-item{display:flex;align-items:center;padding:20px 14px;gap:15px;
  cursor:pointer;border-bottom:1px solid var(--surface2);-webkit-tap-highlight-color:transparent;}
.chk-item:last-child{border-bottom:none;}
.chk-item:active{background:var(--surface2);}
.chk-box{width:40px;height:40px;border-radius:10px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:1.2rem;font-weight:800;color:#fff;transition:all .12s;}
.chk-box.on{background:var(--green);border-color:var(--green);}
.chk-lbl{font-size:1.1rem;line-height:1.4;color:var(--text);}

/* Note */
.note-card{background:var(--surface);border-radius:var(--r);
  padding:14px;margin-bottom:10px;box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);}
.note-label{font-size:.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);display:block;margin-bottom:8px;}
textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:1rem;font-family:inherit;resize:none;
  color:var(--text);background:var(--surface2);}
textarea:focus{outline:none;border-color:var(--text-muted);}

/* ══ ROOM HERO — numero grande in vista dettaglio ══ */
.room-hero{background:linear-gradient(160deg,#1c3a5e 0%,#0c2544 100%);color:#fff;
  padding:20px 16px 18px;text-align:center;border-radius:var(--r);
  margin-bottom:12px;display:flex;flex-direction:column;align-items:center;}
.room-hero-pfx{font-size:.6rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;opacity:.4;line-height:1;margin-bottom:0;}
.room-hero-num{font-size:5.5rem;font-weight:900;line-height:.95;letter-spacing:-.04em;}
.room-hero-piano{margin-top:8px;font-size:.88rem;font-weight:600;opacity:.65;line-height:1;}
.room-hero-bk{margin-top:6px;background:var(--blue);color:#fff;border-radius:5px;
  padding:2px 10px;font-size:.65rem;font-weight:700;letter-spacing:.06em;}

/* Save bar */
.save-bar{position:fixed;bottom:0;left:0;right:0;
  padding:10px 12px max(12px,env(safe-area-inset-bottom));
  background:#1c3a5e;z-index:200;
  box-shadow:0 -4px 24px rgba(0,0,0,.2),0 -1px 0 rgba(201,149,47,.3);
  border-top:2px solid #c9952f;}
.btn-save{width:100%;background:#c9952f;
  color:#fff;border:none;
  padding:18px;border-radius:10px;font-size:1.1rem;font-weight:800;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.9);}
.btn-save:active{opacity:.82;}

/* ══ SUMMARY ══ */
.sum-body{flex:1;overflow-y:auto;padding:12px 12px 28px;}
.sum-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;}
.sum-stat{background:var(--surface);border-radius:var(--r);
  padding:13px 4px;text-align:center;box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);}
.sum-stat-n{font-size:1.4rem;font-weight:800;line-height:1;}
.sum-stat-l{font-size:.56rem;font-weight:600;letter-spacing:.02em;
  color:var(--text-muted);margin-top:4px;line-height:1.2;}
.btn-print-sum{width:100%;background:var(--surface);border:var(--card-border);
  color:var(--text-dim);padding:12px;border-radius:var(--r);
  font-size:.88rem;font-weight:700;cursor:pointer;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  -webkit-tap-highlight-color:transparent;box-shadow:var(--sh-lift),var(--card-top);}
.btn-print-sum:active{opacity:.7;}

.sum-card{background:var(--surface);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-lift),var(--card-top);border:var(--card-border);}
.sum-hdr{padding:12px 16px;font-size:.85rem;font-weight:700;
  display:flex;align-items:center;gap:8px;}
.sum-hdr.h-bottle{background:var(--amber-bg);color:var(--amber);}
.sum-hdr.h-dnd   {background:var(--red-bg);color:var(--red);}
.sum-hdr.h-warn  {background:var(--red-bg);color:var(--red);}

<script>
'use strict';

const PROXY = 'https://anthropic-proxy.qm-d82.workers.dev';

// ── LASCIAPASSARE DI ACCESSO ────────────────────────────────────────────────
// /kv/* del Worker era aperto a chiunque: leggere, scrivere e cancellare tutti i dati di
// Compass senza credenziali (verificato il 02/09/2026). Ora ogni richiesta porta con se' un
// lasciapassare firmato dal Worker, valido sei mesi.
//
// NESSUNO DIGITA PASSWORD. Il dispositivo si abilita aprendo una volta un collegamento con
// #attiva=<lasciapassare>, che si genera da Compass (Impostazioni → Dispositivi) e si manda
// su WhatsApp. Il lasciapassare finisce in localStorage e il collegamento viene ripulito
// dalla barra dell'indirizzo, cosi' non resta nella cronologia condivisa.
//
// Si aggancia a fetch invece di modificare le decine di chiamate esistenti: un punto solo,
// nessuna possibilita' di dimenticarne una. Vale solo per gli indirizzi /kv/ di questo
// Worker; tutto il resto passa intatto.
const QM_PASS_KEY='qm_pass';
let _qmPass='';
try{_qmPass=localStorage.getItem(QM_PASS_KEY)||'';}catch(e){}
// Estrae il lasciapassare da un indirizzo di attivazione. Funzione a se' per poterla
// provare: il resto (localStorage, cronologia) dipende dal browser e non si presta.
function qmEstraiAttiva(indirizzo){
  const m=String(indirizzo||'').match(/[#?&]attiva=([^&#]+)/);
  if(!m)return null;
  try{return decodeURIComponent(m[1])||null;}catch(e){return null;}
}
(function(){
  try{
    const p=qmEstraiAttiva(location.hash+location.search);
    if(!p)return;
    _qmPass=p;
    try{localStorage.setItem(QM_PASS_KEY,_qmPass);}catch(e){}
    // Via dall'indirizzo: un collegamento con dentro il lasciapassare non deve restare
    // nella cronologia ne' finire in uno screenshot.
    try{history.replaceState(null,'',location.pathname);}catch(e){}
  }catch(e){}
})();

// ── ATTIVAZIONE DA DENTRO L'APP ─────────────────────────────────────────────
// Il collegamento ricevuto su WhatsApp si apre in Safari, mentre un'app aggiunta alla
// schermata iniziale ha una memoria tutta sua: il lasciapassare finirebbe in Safari e
// l'app con l'icona resterebbe fuori, cosa di cui ci si accorgerebbe solo il giorno in cui
// si chiude la porta. Per questo l'attivazione deve poter avvenire QUI dentro: si incolla
// il codice ricevuto e basta. Nessuna password, nessun nome utente.
function qmMostraAttivazione(bloccante){
  if(document.getElementById('qm-attiva-box'))return;
  const d=document.createElement('div');
  d.id='qm-attiva-box';
  // Velo PIENO, non trasparente: da una macchina non abilitata non si deve intravedere
  // niente di quello che c'e' sotto — ne' nomi di ospiti ne' numeri. Stessi colori dello
  // splash di Compass, cosi' chi arriva capisce dove si trova e che non e' un guasto.
  d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#1E3553;display:flex;align-items:center;justify-content:center;padding:18px;font-family:inherit;';
  d.innerHTML='<div style="max-width:360px;width:100%;text-align:center;color:#fff;">'
    +'<img src="img/compass-stella.png" alt="" style="width:96px;height:96px;object-fit:contain;margin-bottom:16px;filter:brightness(1.18) saturate(1.1) drop-shadow(0 0 18px rgba(201,149,47,.5));">'
    +'<div style="font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:2px;">Compass <span style="color:#C9952F;">QM</span></div>'
    +'<div style="font-size:14px;color:#9fb0cb;margin-bottom:20px;">Dispositivo da abilitare</div>'
    +'<input id="qm-attiva-campo" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="incolla il codice"'
    +' style="width:100%;padding:10px;border:1px solid #4a5f80;background:#16283f;color:#fff;border-radius:8px;font-size:14px;text-align:center;font-family:inherit;margin-bottom:12px;">'
    +'<div style="display:flex;gap:9px;justify-content:center;">'
    +'<button id="qm-attiva-ok" style="background:#C9952F;color:#20344f;border:none;padding:9px 22px;font-weight:700;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;">Abilita</button>'
    +(bloccante?'':'<button id="qm-attiva-no" style="background:transparent;color:#9fb0cb;border:1px solid #4a5f80;padding:9px 16px;border-radius:7px;font-size:14px;cursor:pointer;font-family:inherit;">Più tardi</button>')
    +'</div>'
    +'<div id="qm-attiva-msg" style="font-size:12px;color:#ffb4ae;margin-top:10px;min-height:15px;"></div>'
    +'</div>';
  document.body.appendChild(d);
  const campo=document.getElementById('qm-attiva-campo');
  const msg=document.getElementById('qm-attiva-msg');
  try{campo.focus();}catch(e){}
  document.getElementById('qm-attiva-ok').onclick=function(){
    // Si accetta sia il codice nudo sia il collegamento intero: chi incolla dalla chat
    // spesso porta con se' tutto l'indirizzo, e pretendere la sola parte finale sarebbe
    // un modo sicuro di far sbagliare.
    const v=String(campo.value||'').trim();
    const p=qmEstraiAttiva(v)||v;
    if(!/^\d{10,}\.[A-Za-z0-9_-]{20,}$/.test(p)){msg.textContent='Codice non riconosciuto: incollalo di nuovo, tutto intero.';return;}
    _qmPass=p;
    try{localStorage.setItem(QM_PASS_KEY,p);}catch(e){}
    d.remove();
    location.reload();
  };
  const no=document.getElementById('qm-attiva-no');
  if(no)no.onclick=function(){d.remove();};
}
// All'avvio: se il dispositivo non e' abilitato lo si dice, senza bloccare. Diventera'
// bloccante da solo quando il Worker comincera' a rifiutare (401), perche' a quel punto
// l'app non potrebbe comunque lavorare.
(function(){
  if(_qmPass)return;
  try{
    if(document.readyState==='loading')
      document.addEventListener('DOMContentLoaded',function(){qmMostraAttivazione(false);});
    else qmMostraAttivazione(false);
  }catch(e){}
})();

(function(){
  if(typeof window==='undefined'||!window.fetch||window._qmFetchAgganciata)return;
  const vero=window.fetch.bind(window);
  window._qmFetchAgganciata=true;
  window.fetch=function(risorsa,opz){
    try{
      const u=typeof risorsa==='string'?risorsa:'';
      // Il lasciapassare va su OGNI richiesta al Worker, non solo su /kv/: anche il proxy
      // verso Claude parte da qui, e senza header chiunque conosca l'indirizzo puo' far
      // girare richieste a carico della chiave API. Aggiungerlo dove non serve non fa danni,
      // ometterlo dove serve spegne l'analisi dei PDF.
      if(_qmPass&&u&&u.indexOf(PROXY)===0){
        opz=Object.assign({},opz||{});
        opz.headers=Object.assign({},opz.headers||{},{'X-QM-Pass':_qmPass});
      }
    }catch(e){}
    const r=vero(risorsa,opz);
    // Se il Worker rifiuta (porta chiusa e lasciapassare assente o scaduto), il velo torna
    // e diventa invalicabile: da quel momento l'app non potrebbe comunque lavorare, e
    // lasciar navigare una pagina vuota farebbe solo pensare a un guasto. Succede da solo,
    // senza ripubblicare niente: basta chiudere la porta su Cloudflare.
    try{
      const u2=typeof risorsa==='string'?risorsa:'';
      if(u2&&u2.indexOf('/kv/')>=0&&u2.indexOf(PROXY)===0){
        r.then(function(res){
          if(res&&res.status===401){
            try{localStorage.removeItem(QM_PASS_KEY);}catch(e){}
            _qmPass='';
            try{qmMostraAttivazione(true);}catch(e){}
          }
        }).catch(function(){});
      }
    }catch(e){}
    return r;
  };
})();

// ── SCRITTURE SUL CLOUD ──────────────────────────────────────────────────────
// Il piano gratuito di Cloudflare concede 1.000 scritture al giorno e l'01/09/2026 siamo
// arrivati a 934. Il consumo non veniva da chi lavorava: quest'app riscriveva l'archivio
// delle colazioni ogni dieci minuti, per ogni dispositivo con l'app aperta, quasi sempre
// con dati identici. Qui si ricorda l'ultimo valore scritto per chiave e si salta la
// scrittura se non e' cambiato nulla. Se fallisce si dimentica, altrimenti quel valore non
// verrebbe piu' ritentato.
const _qmKvUltimo={};
// LA SCRITTURA VERA, e deve restare una funzione SEPARATA da qmKvSet. Nella prima versione
// del filtro (01/09/2026) qui c'era `return qmKvSet(key,v)`: la chiamata ricorsiva trovava
// il valore appena memorizzato, tornava subito `Promise.resolve(true)` e la fetch NON
// PARTIVA MAI. Nessun errore da nessuna parte — l'app continuava a salvare in
// localStorage, quindi sul dispositivo sembrava tutto a posto, mentre nessun altro
// dispositivo vedeva piu' niente. Il giro Culligan del 02/09 e' sparito cosi'.
function _qmKvScrivi(key,v){
  return fetch(PROXY+'/kv/set',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:key,value:v})});
}
function qmKvSet(key,value){
  const v=typeof value==='string'?value:JSON.stringify(value);
  if(_qmKvUltimo[key]===v)return Promise.resolve(true);
  _qmKvUltimo[key]=v;
  return _qmKvScrivi(key,v)
    .then(r=>{if(!r.ok)delete _qmKvUltimo[key];return r.ok;})
    .catch(e=>{delete _qmKvUltimo[key];throw e;});
}

async function qmCheckAppStatus(){
  try{
    const r=await fetch(PROXY+'/kv/get?key=qm_app_status',{cache:'no-store'});
    const j=await r.json();
    const st=j&&j.value?JSON.parse(j.value):{};
    const disabled=st.cm===false;
    const scr=document.getElementById('qm-maintenance-screen');
    if(scr)scr.style.display=disabled?'flex':'none';
    document.body.style.overflow=disabled?'hidden':'';
  }catch(e){}
}
qmCheckAppStatus();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')qmCheckAppStatus();});
// Il controllo gira solo quando l'app è davvero a schermo: un'app lasciata aperta in
// secondo piano sul telefono leggeva il cloud ogni 30 secondi per settimane, e sono
// letture che nessuno vede (avviso Cloudflare sul tetto KV, 31/08/2026). Il ritorno in
// primo piano lo ricontrolla comunque subito, con il gestore qui sopra: spegnere l'app
// dal Pannello App resta immediato per chi la sta usando.
setInterval(()=>{if(document.visibilityState==='visible')qmCheckAppStatus();},60000);

// ── AGGIORNAMENTO AUTOMATICO DELL'APP ──
// Un'app aperta e mai chiusa continua a usare il codice con cui è stata caricata: sullo
// smartphone può restare settimane nello scorrimento delle app aperte. Il 22/08/2026 una
// copia rimasta aperta ha continuato a riscrivere l'archivio delle colazioni con la regola
// vecchia, ore dopo che la correzione era stata pubblicata — e da qui non c'era modo né di
// accorgersene né di rimediare: spegnere l'app dal Pannello App copre l'interfaccia ma non
// ferma il codice che gira sotto.
//
// Qui si chiede al server se il file di QUESTA pagina è cambiato, confrontando l'ETag (o in
// mancanza la data di ultima modifica): cambia solo quando cambia il contenuto, quindi non
// c'è nessun numero di versione da ricordare di aggiornare. La richiesta è HEAD: scarica le
// intestazioni, non la pagina.
//
// Non ricarica mentre si sta scrivendo in un campo, per non far perdere quello che si sta
// digitando: riproverà al controllo successivo.
// Versione di QUESTO file, aggiornata da strumenti/versione.sh a ogni pubblicazione.
// Serve a rispondere alla domanda che il controllo sull'ETag non sapeva porsi: la pagina
// che sto eseguendo e' davvero l'ultima pubblicata? Leggere la versione del server e
// prenderla come riferimento non basta — se la pagina caricata e' vecchia, il confronto
// parte gia' sbagliato e nessun controllo successivo se ne accorge.
const QM_APP_BUILD='2026-09-05.1';
let _qmVersioneFile=null,_qmVersioneTs=0;

// Ricarica bypassando ogni cache. Il service worker, quando la rete al risveglio non e'
// pronta, ripiega sulla copia salvata: e' cosi' che riaprendo l'app si rivedeva la
// versione vecchia. Un indirizzo mai visto prima non e' in nessuna cache.
// Il segno in sessionStorage impedisce di ricaricare all'infinito se qualcosa non torna.
function _qmRicarica(){
  try{ if(sessionStorage.getItem('qm_ricaricata'))return; sessionStorage.setItem('qm_ricaricata','1'); }catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
}

// All'avvio: confronta la versione scritta dentro questa pagina con quella pubblicata.
async function qmCheckBuild(){
  try{
    const r=await fetch(location.pathname+'?c='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/QM_APP_BUILD='([^']+)'/);
    if(m&&m[1]&&m[1]!==QM_APP_BUILD)_qmRicarica();
  }catch(e){}
}
async function qmCheckVersione(){
  // Tre eventi possono chiamarla a raffica (risveglio + fuoco + timer): una verifica ogni
  // 20 secondi basta e avanza, il resto sarebbe traffico inutile sul telefono.
  const ora=Date.now(); if(ora-_qmVersioneTs<20000)return; _qmVersioneTs=ora;
  try{
    const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
    const v=r.headers.get('ETag')||r.headers.get('Last-Modified')||'';
    if(!v)return;                                            // server che non le espone
    if(_qmVersioneFile===null){_qmVersioneFile=v;return;}     // prima lettura: riferimento
    if(v===_qmVersioneFile)return;
    const a=document.activeElement;
    if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return; // sta scrivendo: non ora
    location.reload();
  }catch(e){}                                                // rete assente: si riprova
}
qmCheckBuild();
qmCheckVersione();
// Tre risvegli diversi, perche' i telefoni ne usano tre.
//  - visibilitychange: si torna sull'app fra le schede aperte
//  - pageshow con persisted: la pagina era CONGELATA e viene ripristinata. E' il caso di
//    chi chiude l'app dalla schermata iniziale e la riapre: il telefono non ricarica
//    niente, rimette a schermo il DOM di prima, e senza questo evento l'app resterebbe
//    col codice vecchio finche' non si preme aggiorna a mano.
//  - focus: rete assente al risveglio, il controllo fallisce e si riprova al primo fuoco.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')qmCheckVersione();});
window.addEventListener('pageshow',e=>{if(e&&e.persisted)qmCheckVersione();});
window.addEventListener('focus',()=>qmCheckVersione());
setInterval(qmCheckVersione,600000);   // ogni 10 minuti

    if(!j||!j.value)return;
    const ad=JSON.parse(j.value);

    const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();

let _state = {};
let _cur   = null;
let _pianoDay    = null;
let _pianoLoaded = false; // true se piano trovato ovunque (anche se oggi non è nel piano)

function _todayKey() {
  const d = new Date();
  return 'qm_cm_'+d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

// ── PIANO ────────────────────────────
function _todayDMY() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'/'+
         String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
async function _loadPiano() {
  // 1. KV cloud — sempre fonte principale (aggiornato dal PC/dashboard)
  try {
    const r = await fetch(PROXY + '/kv/get?key=qm_piano');
    if (r.ok) {
      const j = await r.json();
      if (j?.value) {
        try { localStorage.setItem('qm_piano', j.value); } catch(e) {}
        const piano = JSON.parse(j.value);
        if (piano?.giorni?.length) {
          _pianoLoaded = true;
          _pianoDay = piano.giorni.find(g => g.data === _todayDMY()) || null;
          if (_pianoDay) _applyPianoLibere();
          return;
        }
      }
    }
  } catch(e) {}
  // 2. localStorage — fallback solo se KV non raggiungibile (offline)
  try {
    const raw = localStorage.getItem('qm_piano');
    if (raw) {
      const piano = JSON.parse(raw);
      if (piano?.giorni?.length) {
        _pianoLoaded = true;
        _pianoDay = piano.giorni.find(g => g.data === _todayDMY()) || null;
        if (_pianoDay) _applyPianoLibere();
      }
    }
  } catch(e) {}
}
async function _reloadPianoCloud() {
  const pb=document.getElementById('piano-banner');
  if(pb) pb.innerHTML=`<div class="piano-banner missing">⏳ Caricamento dal cloud…</div>`;
  _pianoLoaded=false;_pianoDay=null;
  try {
    const r=await fetch(PROXY+'/kv/get?key=qm_piano');
    if(r.ok){
      const j=await r.json();
      if(j?.value){
        try{localStorage.setItem('qm_piano',j.value);}catch(e){}
        const piano=JSON.parse(j.value);
        if(piano?.giorni?.length){
          _pianoLoaded=true;
          _pianoDay=piano.giorni.find(g=>g.data===_todayDMY())||null;
          if(_pianoDay)_applyPianoLibere();
        }
      }
    }
  }catch(e){}
  _renderHome();
}
function _applyPianoLibere() {
  if (!_pianoDay) return;
  const sa = _pianoDay.soulart;
  const inPlan = new Set([...sa.partenze, ...sa.fermate, ...sa.cambi]);
  ROOMS.forEach(room => {
    if (!inPlan.has(room) && !_state[room]) {
      _state[room] = _defaultRoom();
      _state[room].visited = true;
      _state[room].libera  = true;
    }
  });
}
function _pianoSt(room) {
  if (!_pianoDay) return null;
  const sa = _pianoDay.soulart;
  if (sa.cambi.includes(room))    return 'cambio';
  if (sa.partenze.includes(room)) return 'partenza';
  if (sa.fermate.includes(room))  return 'fermata';
  return 'libera';
}

// ── PERSISTENZA ──────────────────────
async function _load() {
  // 1. KV cloud — source of truth condivisa tra tutti i dispositivi
  try {
    const r=await fetch(PROXY+'/kv/get?key='+encodeURIComponent(_todayKey()));
    if(r.ok){
      const j=await r.json();
      if(j?.value){
        _state=JSON.parse(j.value);
        try{localStorage.setItem(_todayKey(),j.value);}catch(e){}
        return;
      }
    }
  }catch(e){}
  // 2. Fallback: localStorage locale
  try{const r=localStorage.getItem(_todayKey());if(r)_state=JSON.parse(r);}catch(e){}
  // Il giro c'e' qui ma sul cloud no: e' esattamente cio' che ha prodotto il difetto del
  // 01/09 (le scritture non partivano e restavano solo sul telefono). Si ripubblica, cosi'
  // il giro gia' fatto ricompare sul PC senza doverlo rifare. Solo quando il cloud e'
  // VUOTO per quella giornata: se ha gia' qualcosa e' piu' aggiornato di questa copia e
  // non va sovrascritto.
  if(Object.keys(_state||{}).length)_persist();
}
function _persist() {
  try { localStorage.setItem(_todayKey(),JSON.stringify(_state)); } catch(e){}
  qmKvSet(_todayKey(),JSON.stringify(_state)).catch(()=>{});
}
function _defaultRoom() {
  const checks={};
  ALL_IDS.forEach(id=>checks[id]=true);
  // pronta: null finché non verificata, poi true/false — solo per camere non in
  // fermata (partenza/cambio), lette in tempo reale dalla reception su Compass.
  return {visited:false, libera:false, dnd:false, bottiglia:'consumata', checks, note:'', consegnata:false, pronta:null};
}
function _rs(room) {
  if(!_state[room])_state[room]=_defaultRoom();
  return _state[room];
}

// ── STATUS ───────────────────────────
// dnd    = Non Disturbare (non visitabile)
// bottle = bottiglia consumata (vuota) → portare bottiglia
// ok     = bottiglia non consumata (piena) + tutto conforme
function _status(room) {
  const rs=_state[room];
  if(!rs||!rs.visited) return 'pending';
  if(rs.dnd)           return 'dnd';
  if(rs.libera)        return 'empty';
  if(rs.bottiglia==='non_presente') return 'missing';
  const nc=Object.values(rs.checks).some(v=>!v);
  const nb=rs.bottiglia==='consumata'; // consumata = vuota = porta bottiglia
  if(nc&&nb) return 'both';
  if(nc)     return 'warn';
  if(nb)     return 'bottle';
  return 'ok';
}

// Camere con bottiglia trovata vuota durante il giro di ritiro (stato 'bottle'/'both'),
// escluse le Non Disturbare — sono quelle che vanno riconsegnate piene nel secondo giro.
function _redeliverRooms(){
  return ROOMS.filter(r=>{const s=_status(r);return s==='bottle'||s==='both';});
}

function _scrollToRoom(room){
  if(!room)return;
  const el=document.getElementById('rc-'+room.replace(/\s+/g,'-'));
  if(el)el.scrollIntoView({block:'center',behavior:'instant'});
}
function goHome(){
  // Il popup vive sul body: uscendo dalla camera va chiuso a mano, altrimenti resterebbe
  // sopra la griglia riferendosi a una stanza che non si sta più guardando.
  chiudiPopPronta();
  const lastRoom=_cur;
  _screen('s-home');
  _renderHome();
  requestAnimationFrame(()=>_scrollToRoom(lastRoom));
  _loadPiano().then(()=>{_renderHome();requestAnimationFrame(()=>_scrollToRoom(lastRoom));});

function _renderHome(){
  document.getElementById('home-chip').textContent=_fmtShort();

  // Progress (esclude le libere auto-impostate)
  const active=ROOMS.filter(r=>_pianoSt(r)!=='libera'||!_pianoDay);
  const visited=active.filter(r=>_state[r]?.visited&&!_state[r]?.libera).length;
  const total=active.length;
  document.getElementById('prog-txt').textContent=visited+' / '+total;
  document.getElementById('prog-fill').style.width=(total>0?(visited/total*100):0)+'%';

  // Stats
  let nBtl=0,nDnd=0,nOk=0,nPend=0;
  ROOMS.forEach(r=>{
    const s=_status(r);
    if(s==='bottle'||s==='both'||s==='missing') nBtl++;
    else if(s==='dnd')                          nDnd++;
    else if(s==='ok')            nOk++;
    else if(s==='pending')       nPend++;
  });
  // Badge riconsegna: quante restano da riconsegnare (bottiglia vuota, non ancora consegnata)
  const daRiconsegnare=_redeliverRooms().filter(r=>!_rs(r).consegnata).length;
  document.getElementById('redeliver-badge').textContent=daRiconsegnare?' ('+daRiconsegnare+')':'';

  document.getElementById('stat-row').innerHTML=[
    [nBtl,'Da portare','var(--navy-light)','var(--navy-light-bg)','rgba(91,122,156,.3)'],
    [nDnd,'Non Dist.','var(--red)','var(--red-bg)','rgba(220,38,38,.15)'],
    [nOk, 'OK','var(--navy)','var(--navy-bg)','rgba(28,58,94,.18)'],
    [nPend,'Da fare','var(--text-dim)','var(--surface2)','rgba(0,0,0,.08)'],
  ].map(([n,lbl,col,bg,bdr])=>`<div class="stat-box" style="background:${bg};border:1.5px solid ${bdr};">
    <div class="stat-n" style="color:${col}">${n}</div>
    <div class="stat-l">${lbl}</div>
  </div>`).join('');

  // Grid — 3 colonne
  // Piano: icona grande + label (info principale)
  // Dot in basso: stato visita/bottiglia (info secondaria)
  const PS_ICO ={
    partenza:'<img src="img/aerei.png" class="ico-partenza" alt="Partenza">',
    fermata: '<img src="img/fermata.png" class="ico-fermata" alt="Fermata">',
    cambio:  '<img src="img/aerei.png" class="ico-cambio" alt="Partenza+Arrivo">',
    libera:  '<img src="img/open-sign.png" alt="Libera" style="height:30px;width:auto;display:block;margin:2px auto 0;">',
    null:    '—'
  };
  const PS_LBL ={partenza:'Partenza',fermata:'Fermata',cambio:'Partenza + Arrivo',libera:'Libera'};
  const normCam=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
  document.getElementById('rooms-grid').innerHTML=ROOMS.map(room=>{
    const st=_status(room);
    const ps=_pianoSt(room);
    const ico=ps?PS_ICO[ps]:'—';
    const lbl=ps?PS_LBL[ps]:'';
    const isBk=_arriviBooking.has(normCam(room));
    // Separa prefisso (Art) dal numero per renderli a dimensioni diverse
    const rParts=room.split(' ');
    const rNum=rParts.length>1?rParts.slice(1).join(' '):room;
    const rPfx=rParts.length>1?rParts[0]:'';
    // Icona affiancata al numero: bottiglia blu = ancora da controllare/consumata,
    // spunta = non consumata/tutto ok. Solo su questi due stati, non sostituisce il
    // resto della card — la parte bassa bianca con le info camera resta invariata.
    // Bottiglia navy piena (non più blu, resta nella famiglia navy) più grande della
    // spunta perché è lo stato che richiede un'azione — deve saltare all'occhio di più.
    const sideIcon=(st==='bottle'||st==='both')
      ?`<svg class="rc-side-ico" viewBox="0 0 24 24" width="52" height="52" fill="var(--navy)"><path d="M9 2h6M9 2v3.2c0 .6-.3 1.1-.8 1.5C7.1 7.6 6.5 9 6.5 10.5V20a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-9.5c0-1.5-.6-2.9-1.7-3.8-.5-.4-.8-.9-.8-1.5V2"/></svg>`
      :st==='ok'
      ?`<svg class="rc-side-ico" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>`
      :'';
    return`<div class="room-card s-${st}" id="rc-${room.replace(/\s+/g,'-')}" onclick="openRoom('${room}')">
      <div class="rc-top">
        <div class="rc-top-row">
          <div class="rc-num">
            ${rPfx?`<span class="rc-prefix">${rPfx}</span>`:''}
            <span class="rc-roomnum">${rNum}</span>
            ${isBk?'<span style="font-size:.55rem;background:rgba(255,255,255,.92);color:#1c3a5e;border-radius:4px;padding:1px 5px;font-weight:700;margin-top:1px;line-height:1.6;">BK</span>':''}
          </div>
          ${sideIcon}
        </div>
      </div>
      <div class="rc-bottom">
        <div class="rc-piano-ico">${ico}</div>
        <div class="rc-piano-lbl">${lbl}</div>
      </div>
    </div>`;
  }).join('');
}

let _roomSnapshot=null,_roomSnapshotRoom=null;

    _roomSnapshotRoom=room;
    _roomSnapshot=JSON.parse(JSON.stringify(_rs(room)));

        <span class="bseg-body"><span class="bseg-lbl">Non disturbare</span><span class="bseg-sub">non visitare la camera</span></span>
      </button>

  if(rs.dnd){
    // DND attivo: mostra messaggio, nascondi checklist
    h+=`<div class="dnd-card">

    // Checklist (nascosta se camera libera)
    CHECKS.forEach(sec=>{
      const allOn=sec.items.every(i=>rs.checks[i.id]);
      h+=`<div class="chk-sec">
        <div class="chk-sec-hdr">
          <span>${sec.label}</span>
          <button class="chk-all-btn" data-sid="${sec.id}"
            onclick="toggleSec('${sec.id}',${!allOn})">${allOn?'Deseleziona tutti':'Seleziona tutti'}</button>

      sec.items.forEach(item=>{
        const on=rs.checks[item.id];
        h+=`<div class="chk-item" onclick="toggleChk('${item.id}')">
          <div class="chk-box ${on?'on':''}" id="cb-${item.id}">${on?'✓':''}</div>
          <span class="chk-lbl">${item.label}</span>
        </div>`;
      });
      h+=`</div>`;
    });
  }

  h+=`<div class="note-card">
    <label class="note-label">📝 Note</label>
    <textarea id="room-note" rows="3" placeholder="Osservazioni…">${rs.note||''}</textarea>
  </div>`;

  document.getElementById('cl-body').innerHTML=h;
  _screen('s-room');
}

// Popup "camera pronta" — si apre impostando la bottiglia su "non consumata" in una camera
// in partenza + arrivo. Trovando la bottiglia piena non si passa dal giro di riconsegna,
// quindi la domanda resterebbe senza risposta proprio su una camera che va rifatta per il
// nuovo ospite. Scrive lo stesso campo `pronta` del foglio della Riconsegna, letto da Compass.
// È un nodo aggiunto al body, non parte del render della camera: così non viene spazzato
// via dal successivo openRoom e resta sopra la barra di salvataggio.
let _popProntaRoom=null;
function apriPopPronta(room){
  chiudiPopPronta();
  _popProntaRoom=room;
  const d=document.createElement('div');
  d.className='ready-pop';
  d.id='readyPop';
  d.onclick=e=>{if(e.target===d)chiudiPopPronta();};
  d.innerHTML=`<div class="ready-pop-card">
    <div class="ready-sheet-title">${room} è pronta per il nuovo ospite?</div>
    <div class="ready-sheet-btns">
      <button class="ready-big no" onclick="scegliProntaPop(false)">🧹<br>Non pronta</button>
      <button class="ready-big yes" onclick="scegliProntaPop(true)">✓<br>Pronta</button>
    </div>
    <button class="ready-cancel" onclick="chiudiPopPronta()">Decido dopo</button>
  </div>`;
  document.body.appendChild(d);
}
function chiudiPopPronta(){
  const d=document.getElementById('readyPop');
  if(d)d.remove();
  _popProntaRoom=null;
}
function scegliProntaPop(val){
  if(_popProntaRoom){const rs=_rs(_popProntaRoom);rs.pronta=val;rs.prontaVerificata=true;}
  chiudiPopPronta();
}
function setBottle(val){
  const rs=_rs(_cur);
  const wasDnd=rs.dnd;
  const prima=rs.bottiglia;
  rs.bottiglia=val;
  rs.dnd=false;
  // Passando a "non consumata" su una camera in cambio si chiede subito se è pronta.
  // Solo al cambio effettivo di valore: ritoccare il pulsante già attivo non deve
  // far ricomparire il popup.
  const appenaImpostata=val==='non_consumata'&&prima!=='non_consumata';
  if(wasDnd){
    openRoom(_cur);
  } else {
    const c=document.getElementById('bb-cons');
    const n=document.getElementById('bb-nc');
    const p=document.getElementById('bb-np');
    const d=document.getElementById('bb-dnd');
    if(c)c.className='bseg'+(val==='consumata'?' bc-consumata':'');
    if(n)n.className='bseg'+(val==='non_consumata'?' bc-noncons':'');
    if(p)p.className='bseg'+(val==='non_presente'?' bc-nonpres':'');
    if(d)d.className='bseg';
  }
  if(appenaImpostata&&_pianoSt(_cur)==='cambio')apriPopPronta(_cur);
}
function setBottleDnd(){

function toggleLibera(){

}
function toggleDnd(){

}
function tuttoOk(){
  const rs=_rs(_cur);
  ALL_IDS.forEach(id=>{
    rs.checks[id]=true;
    const b=document.getElementById('cb-'+id);
    if(b){b.className='chk-box on';b.textContent='✓';}

function toggleChk(id){
  const rs=_rs(_cur);
  rs.checks[id]=!rs.checks[id];
  const b=document.getElementById('cb-'+id);
  if(b){b.className='chk-box'+(rs.checks[id]?' on':'');b.textContent=rs.checks[id]?'✓':'';}
  const sec=CHECKS.find(s=>s.items.some(i=>i.id===id));
  if(sec){
    const allOn=sec.items.every(i=>rs.checks[i.id]);
    const btn=document.querySelector(`.chk-all-btn[data-sid="${sec.id}"]`);
    if(btn){btn.textContent=allOn?'Deseleziona tutti':'Seleziona tutti';btn.setAttribute('onclick',`toggleSec('${sec.id}',${!allOn})`);}
  }
}
function toggleSec(sid,makeOn){
  const rs=_rs(_cur);const sec=CHECKS.find(s=>s.id===sid);if(!sec)return;
  sec.items.forEach(item=>{
    rs.checks[item.id]=makeOn;
    const b=document.getElementById('cb-'+item.id);
    if(b){b.className='chk-box'+(makeOn?' on':'');b.textContent=makeOn?'✓':'';}
  });
  const btn=document.querySelector(`.chk-all-btn[data-sid="${sid}"]`);
  if(btn){btn.textContent=makeOn?'Deseleziona tutti':'Seleziona tutti';btn.setAttribute('onclick',`toggleSec('${sid}',${!makeOn})`);}
}

}

// ── RICONSEGNA BOTTIGLIE ─────────────
// Secondo giro della giornata: dopo il ritiro delle vuote (fatto stanza per stanza
// nell'app) e il riempimento, si torna in ogni camera segnalata per lasciare la
// bottiglia piena. Sostituisce la lista stampata in A4 — la spunta qui equivale
// al segno fatto a penna sul foglio.
// Camera il cui foglio "pronta/non pronta" è aperto in questo momento — una sola alla
// volta, resettata ogni volta che si entra nella schermata.
let _readySheetRoom=null;
function showRedeliver(){
  _readySheetRoom=null;
  document.getElementById('redeliver-chip').textContent=_fmtShort();
  _renderRedeliver();
  _screen('s-redeliver');
}
function _renderRedeliver(){
  const rooms=_redeliverRooms();
  const done=rooms.filter(r=>_rs(r).consegnata).length;
  let h=`<div class="prog-wrap" style="margin:12px 12px 4px;">
    <div class="prog-row">
      <span class="prog-lbl">Bottiglie riconsegnate</span>
      <span class="prog-val">${done} / ${rooms.length}</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" style="width:${rooms.length?done/rooms.length*100:0}%"></div></div>
  </div>`;
  if(!rooms.length){
    h+=`<div class="sum-card" style="margin:12px;"><div class="sum-hdr h-consegnata">✅ Nessuna bottiglia da riconsegnare</div></div>`;
  } else {
    // Stesse tile della home (leggibili a distanza, telefono fissato sul carrello):
    // gold = da riconsegnare, oliva = consegnata.
    h+=`<div class="rooms-grid" style="margin:8px 12px 24px;">`;
    rooms.forEach(r=>{
      const on=_rs(r).consegnata;
      const rParts=r.split(' ');
      const rNum=rParts.length>1?rParts.slice(1).join(' '):r;
      const rPfx=rParts.length>1?rParts[0]:'';
      // "Pronta per il check-in" ha senso solo per camere non in fermata (partenza/
      // cambio) — in fermata l'ospite è già dentro. Per quelle il tap resta il vecchio
      // toggle diretto di consegnata; per le altre il tap apre il foglio di scelta.
      const ps=_pianoSt(r);
      const readyRelevant=ps&&ps!=='fermata';
      const pr=readyRelevant?_rs(r).pronta:null;
      // Icona in filigrana dietro il numero: bottiglia = ancora da riconsegnare,
      // spunta = consegnata. La tile resta sempre navy — solo l'icona cambia.
      const wm=on
        ?`<svg class="rc-watermark" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>`
        :`<svg class="rc-watermark" viewBox="0 0 24 24" width="56" height="56" fill="#fff"><path d="M9 2h6M9 2v3.2c0 .6-.3 1.1-.8 1.5C7.1 7.6 6.5 9 6.5 10.5V20a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-9.5c0-1.5-.6-2.9-1.7-3.8-.5-.4-.8-.9-.8-1.5V2"/></svg>`;
      const tileTop=`<div class="rc-top">
          ${wm}
          <div class="rc-num">
            ${rPfx?`<span class="rc-prefix">${rPfx}</span>`:''}
            <span class="rc-roomnum">${rNum}</span>
          </div>
        </div>`;
      if(readyRelevant&&_readySheetRoom===r){
        // Foglio aperto: card a piena larghezza con due bottoni grandi. La bottiglia
        // si lascia comunque, pronta o no — scegliendo segna anche consegnata.
        h+=`<div class="room-card s-${on?'consegnata':'bottle'}" style="grid-column:1/-1;cursor:default;" onclick="event.stopPropagation();">
          ${tileTop}
          <div class="ready-sheet">
            <div class="ready-sheet-title">Art ${rNum} è pronta per il check-in?</div>
            <div class="ready-sheet-btns">
              <button class="ready-big no" onclick="chooseReady('${r}',false)">🧹<br>Non pronta</button>
              <button class="ready-big yes" onclick="chooseReady('${r}',true)">✓<br>Pronta</button>
            </div>
            <button class="ready-cancel" onclick="cancelReadySheet('${r}')">Annulla</button>
          </div>
        </div>`;
        return;
      }
      // Partenza/cambio: striscia sempre presente, "da confermare" finché non si
      // sceglie. In fermata niente striscia — "pronta" non si applica.
      const stripCls=pr===true?'yes':pr===false?'no':'pending';
      const stripTxt=pr===true?'✓ pronta':pr===false?'🧹 non pronta':'da confermare';
      // In fermata "pronta" non si applica: niente testo, ma la striscia resta —
      // stesso colore navy della tile sopra — solo per tenere tutte le card della
      // stessa altezza nella griglia, invece di lasciarle più corte.
      const strip=readyRelevant
        ?`<div class="rc-ready-strip ${stripCls}">${stripTxt}</div>`
        :`<div class="rc-ready-strip" style="background:var(--navy);"></div>`;
      const tap=readyRelevant?`openReadySheet('${r}')`:`toggleConsegnata('${r}')`;
      h+=`<div class="room-card s-${on?'consegnata':'bottle'}" onclick="${tap}">
        ${tileTop}
        ${strip}
      </div>`;
    });
    h+=`</div>`;
  }
  document.getElementById('redeliver-body').innerHTML=h;
}
function toggleConsegnata(room){
  const rs=_rs(room);
  rs.consegnata=!rs.consegnata;
  _persist();
  _renderRedeliver();
}
// Apre/chiude il foglio "pronta/non pronta" per una camera (una sola alla volta).
function openReadySheet(room){
  _readySheetRoom=_readySheetRoom===room?null:room;
  _renderRedeliver();
}
// Scelta fatta: la bottiglia si lascia comunque (consegnata sempre true), pronta/non
// pronta resta come badge permanente sulla card. Persistito nello stesso stato
// giornaliero (qm_cm_YYYY-MM-DD) già sincronizzato su KV — la reception lo legge da
// Compass in tempo reale, senza bisogno d'altro.
function chooseReady(room,val){
  const rs=_rs(room);
  rs.pronta=val;
  // prontaVerificata distingue "qualcuno ha davvero controllato questa camera" da
  // "esiste una voce nello stato per altri motivi" (es. il conteggio bottiglie da
  // riconsegnare tocca _rs() per ogni camera, creando l'oggetto anche senza che nessuno
  // abbia guardato lo stato di preparazione). Compass legge questo flag, non la sola
  // presenza della voce, per decidere se applicare il valore automatico o quello scelto
  // a mano — incluso un reset esplicito a "da verificare".
  rs.prontaVerificata=true;
  rs.consegnata=true;
  _readySheetRoom=null;
  _persist();
  _renderRedeliver();
}
// Chiude il foglio senza scegliere; se una scelta era già stata fatta in precedenza
// (pronta/non pronta), la annulla riportando la camera a "da confermare" — prima non
// c'era modo di tornare indietro una volta scelto, solo di passare da pronta a non
// pronta o viceversa.
function cancelReadySheet(room){
  const rs=_rs(room);
  if(rs.pronta!==null){
    rs.pronta=null;
    rs.prontaVerificata=true;
    rs.consegnata=false;
    _persist();
  }
  _readySheetRoom=null;
  _renderRedeliver();
}
async function resetDay(){
  if(!await cqConferma('Azzerare tutti i controlli di oggi?','I controlli già registrati verranno cancellati.',{ok:'Azzera'}))return;
  _state={};_persist();_loadPiano().then(()=>goHome());
}

// ── WAKE LOCK — schermo sempre acceso ────────────────────────────────────────
// Usa Screen Wake Lock API (supportata da Chrome Android e Safari 16.4+)
// Impedisce allo schermo di spegnersi mentre l'app è aperta.
// Non è possibile controllare la luminosità via web API — limitazione del browser.
let _wakeLock = null;
async function _requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
  } catch(e) {}
}
// Ri-acquisisce il lock se la tab torna in primo piano (es. dopo una notifica)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !_wakeLock) _requestWakeLock();
});
_requestWakeLock();

// ── INIT ──────────────────────────────
// _load() è async: aspetta KV prima di caricare il piano e renderizzare
_load().then(() => Promise.all([_loadPiano(), _loadArriviBooking()])).then(() => _renderHome());

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js')
    .then(r=>r.update()).catch(()=>{});
}
</script>
<!-- ── Finestra di conferma Compass ─────────────────────────────────────────
     Stessa maschera della dashboard, portata qui il 23/08/2026: le finestre del
     browser mostrano "compass-qm.com dice", compaiono ancorate in alto e non si
     impaginano. La rosa dei venti dice che a chiedere è Compass — su un'azione che
     cancella dati è l'informazione che conta di più.
     Non usare confirm()/alert(): usare cqConferma (Promise<boolean>, serve await)
     oppure cqAvviso (un pulsante solo, non serve await). -->
<style>
.cq-dialog{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100000;align-items:center;justify-content:center;padding:16px;}
.cq-dialog.open{display:flex;}
.cq-box{position:relative;overflow:hidden;background:var(--surface,#fff);border-radius:10px;width:400px;max-width:100%;padding:26px;text-align:center;border:1px solid var(--border,#e0e0e4);box-shadow:0 20px 60px rgba(0,0,0,.28);}
.cq-box::before{content:'';position:absolute;left:-120px;top:-120px;width:330px;height:330px;
  background:url('img/compass-stella.png') no-repeat center/contain;
  opacity:.13;transform:rotate(22deg);pointer-events:none;}
.cq-title{position:relative;font-size:16px;font-weight:600;color:var(--text,#1a1a1a);margin-bottom:6px;}
.cq-sub{position:relative;font-size:13px;color:var(--text-muted,#6b6b70);margin-bottom:22px;line-height:1.5;}
.cq-btns{position:relative;display:flex;gap:10px;justify-content:center;}
.cq-ok{background:#1c3a5e;color:#fff;border:none;padding:9px 26px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.cq-no{background:transparent;color:var(--text-muted,#6b6b70);border:1px solid var(--border,#e0e0e4);padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}
</style>
<div class="cq-dialog" id="cqDialog">
  <div class="cq-box">
    <div class="cq-title" id="cqTitle"></div>
    <div class="cq-sub" id="cqSub"></div>
    <div class="cq-btns">
      <button class="cq-ok" id="cqOk"></button>
      <button class="cq-no" id="cqNo">Annulla</button>
    </div>
  </div>
</div>
<script>
function _cqApri(o){
  const d=document.getElementById('cqDialog');
  if(!d)return Promise.resolve(o.soloAvviso?true:window.confirm(o.titolo));   // ripiego
  document.getElementById('cqTitle').textContent=o.titolo||'';
  document.getElementById('cqSub').innerHTML=o.testo||'';
  const bOk=document.getElementById('cqOk'), bNo=document.getElementById('cqNo');
  bOk.textContent=o.ok||'Conferma';
  bNo.style.display=o.soloAvviso?'none':'';
  d.classList.add('open');
  bOk.focus();
  return new Promise(res=>{
    const fine=v=>{
      d.classList.remove('open');
      bOk.onclick=bNo.onclick=d.onclick=null;
      document.removeEventListener('keydown',tasto);
      res(v);
    };
    const tasto=e=>{ if(e.key==='Escape')fine(false); if(e.key==='Enter')fine(true); };
    bOk.onclick=()=>fine(true);
    bNo.onclick=()=>fine(false);
    d.onclick=e=>{if(e.target===d)fine(false);};
    document.addEventListener('keydown',tasto);
  });
}
function cqConferma(titolo,testo,opz){
  const o=opz||{};
  return _cqApri({titolo,testo,ok:o.ok||'Conferma'});
}
// Accetta anche un messaggio solo con gli a capo, nel formato dei vecchi alert():
// la prima riga diventa il titolo, il resto la spiegazione.
function cqAvviso(titolo,testo,opz){
  const o=opz||{};
  let t=String(titolo||''), c=testo;
  if(c===undefined&&/\n/.test(t)){
    const i=t.indexOf('\n');
    c=t.slice(i).replace(/^\n+/,'');
    t=t.slice(0,i);
  }
  if(typeof c==='string')c=c.replace(/\n/g,'<br>');
  return _cqApri({titolo:t,testo:c||'',ok:o.ok||'Ho capito',soloAvviso:true});
}
</script>
