<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anteprima conferme Compass</title>
<link rel="stylesheet" href="style.css?v=260">
<style>
  body{padding:26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;}
  h1{font-size:17px;font-weight:600;margin:0 0 4px;}
  p.n{font-size:13px;color:var(--text-muted);margin:0 0 20px;line-height:1.5;}
  .prova{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .prova button{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 15px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text);}
  .sez{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px;font-weight:600;}
  #esito{margin-top:16px;font-size:13px;color:var(--text-muted);min-height:20px;}

  /* Le tre inclinazioni da confrontare: sovrascrivono solo la filigrana */
  .cq-dialog.v-b .cq-box::before{left:-78px;top:-78px;width:245px;height:245px;opacity:.10;transform:rotate(35deg);}
  .cq-dialog.v-c .cq-box::before{left:-34px;top:-34px;width:140px;height:140px;opacity:.18;transform:rotate(15deg);}
</style>

<h1>Finestra di conferma — anteprima</h1>
<p class="n">Usa il foglio di stile vero di Compass: quello che vedi è l'implementazione
reale. Prova anche Invio, Esc e il clic fuori dal riquadro.</p>

<div class="sez">A — inclinata 22°, opacità 13% (impostazione attuale)</div>
<div class="prova">
  <button onclick="p('a','elimina')">Eliminare un arrivo</button>
  <button onclick="p('a','invia')">Inviare i messaggi</button>
  <button onclick="p('a','avviso')">Avviso a un pulsante</button>
</div>

<div class="sez">B — più grande, 35°, più tenue</div>
<div class="prova">
  <button onclick="p('b','elimina')">Eliminare un arrivo</button>
  <button onclick="p('b','invia')">Inviare i messaggi</button>
</div>

<div class="sez">C — più contenuta, 15°, più marcata</div>
<div class="prova">
  <button onclick="p('c','elimina')">Eliminare un arrivo</button>
  <button onclick="p('c','invia')">Inviare i messaggi</button>
</div>

<div id="esito"></div>

<div class="cq-dialog" id="cqDialog">
  <div class="cq-box">
    <div class="cq-title" id="cqTitle"></div>
    <div class="cq-sub" id="cqSub"></div>
    <div class="cq-btns">
      <button class="cq-ok" id="cqOk"></button>
      <button class="cq-no" id="cqNo">Annulla</button>
    </div>
  </div>
</div>

<script>
function _cqApri(o){
  const d=document.getElementById('cqDialog');
  document.getElementById('cqTitle').textContent=o.titolo||'';
  document.getElementById('cqSub').innerHTML=o.testo||'';
  const bOk=document.getElementById('cqOk'), bNo=document.getElementById('cqNo');
  bOk.textContent=o.ok||'Conferma';
  bNo.style.display=o.soloAvviso?'none':'';
  d.classList.add('open');
  bOk.focus();
  return new Promise(res=>{
    const fine=v=>{d.classList.remove('open');bOk.onclick=bNo.onclick=d.onclick=null;document.removeEventListener('keydown',tasto);res(v);};
    const tasto=e=>{if(e.key==='Escape')fine(false);if(e.key==='Enter')fine(true);};
    bOk.onclick=()=>fine(true);
    bNo.onclick=()=>fine(false);
    d.onclick=e=>{if(e.target===d)fine(false);};
    document.addEventListener('keydown',tasto);
  });
}
function cqConferma(t,s,o){o=o||{};return _cqApri({titolo:t,testo:s,ok:o.ok||'Conferma'});}
function cqAvviso(t,s,o){o=o||{};return _cqApri({titolo:t,testo:s,ok:o.ok||'Ho capito',soloAvviso:true});}

const esito=t=>document.getElementById('esito').textContent=t;
const CASI={
  elimina:['Eliminare questo arrivo?','<strong>Milano Emanuela</strong><br>I dati inseriti andranno persi.','Elimina'],
  invia:['Inviare 12 messaggi?','SoulArt Hotel · 12 ospiti con email<br>3 senza contatto verranno saltati.','Invia'],
  avviso:['Nessun arrivo riconosciuto','Controlla di aver esportato con filtro <strong>Presenti</strong> e tutte le strutture.','Ho capito']
};
async function p(variante,caso){
  const d=document.getElementById('cqDialog');
  d.className='cq-dialog'+(variante==='a'?'':' v-'+variante);
  const c=CASI[caso];
  const ok = caso==='avviso'
    ? await cqAvviso(c[0],c[1])
    : await cqConferma(c[0],c[1],{ok:c[2]});
  esito('variante '+variante.toUpperCase()+' → '+(ok?'confermato':'annullato'));
}
</script>
